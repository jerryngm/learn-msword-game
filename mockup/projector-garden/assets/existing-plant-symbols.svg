  <linearGradient id="gWilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9BC73"/><stop offset="1" stop-color="#A39552"/></linearGradient>
  <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9774A"/><stop offset=".6" stop-color="#E8916A"/><stop offset="1" stop-color="#C9673D"/></linearGradient>
  <linearGradient id="gBroth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4C77A"/><stop offset="1" stop-color="#E3A452"/></linearGradient>
