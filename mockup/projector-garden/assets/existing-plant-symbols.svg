  <path d="M50 86 C40 88 32 94 28 100 C38 100 46 94 50 86Z" fill="url(#gWilt)"/>
  <path d="M51 76 C61 77 69 84 71 92 C61 90 53 85 51 76Z" fill="url(#gWilt)"/>
