      <ellipse rx="6" ry="12" transform="rotate(180) translate(0 -12)"/><ellipse rx="6" ry="12" transform="rotate(225) translate(0 -12)"/>
      <ellipse rx="6" ry="12" transform="rotate(270) translate(0 -12)"/><ellipse rx="6" ry="12" transform="rotate(315) translate(0 -12)"/>
    </g>
    <circle r="9" fill="#F29B38"/><circle r="9" fill="#8A5A3B" opacity=".35"/><circle cx="-3" cy="-3" r="2" fill="#fff" opacity=".35"/>
