  <use href="#leafL" x="49.4" y="88" fill="url(#gLeaf2)"/>
  <use href="#leafR" x="49.6" y="78" fill="url(#gLeaf)"/>
  <use href="#leafL" x="50.6" y="62" fill="url(#gLeaf)"/>
