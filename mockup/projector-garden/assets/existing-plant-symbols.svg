  <path d="M51 88 q1 -7 8 -9" stroke="#6DAE57" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M58.5 79.2 c3 -1.5 6.5 -.6 7.6 1.8 c-3 2 -6.6 1.2 -7.6 -1.8z" fill="#8CC56A"/>
</symbol>
<symbol id="p-sprout" viewBox="0 0 100 110">
  <path d="M50 98 C50 88 49 78 50 66" stroke="#4F8F43" stroke-width="4" fill="none" stroke-linecap="round"/>
  <use href="#leafL" x="49.6" y="76" fill="url(#gLeaf)"/>
  <use href="#leafR" x="50" y="67" fill="url(#gLeaf2)"/>
  <use href="#mound"/>
</symbol>
<symbol id="p-leafy" viewBox="0 0 100 110">
